<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario Inteligente Prolog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#1e212b',
                        panelBg: '#282c37',
                        accent: '#ff5c5c',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-200 h-screen flex font-sans overflow-hidden">

    <!-- PANEL LATERAL: DESPENSA Y FILTROS -->
    <aside class="w-72 bg-panelBg border-r border-gray-700 flex flex-col">
        <!-- Encabezado del Panel -->
        <div class="p-6 border-b border-gray-700">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <span>🍳</span> Recetario Experto
            </h1>
        </div>

        <!-- Buscador de Ingredientes -->
        <div class="p-4">
            <input type="text" placeholder="Buscar ingrediente..." 
                   class="w-full bg-darkBg border border-gray-600 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-accent text-white">
        </div>

        <!-- Lista de Ingredientes (AQUÍ AGUSTÍN HACE EL BUCLE / FOR) -->
        <div class="flex-1 overflow-y-auto px-4 pb-4">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Mi Despensa</h2>
            <div class="space-y-3">
                <!-- Ítem de Ingrediente -->
                <label class="flex items-center gap-3 cursor-pointer group">
                    <input type="checkbox" class="w-4 h-4 rounded border-gray-500 text-accent focus:ring-accent accent-accent">
                    <span class="text-xl">🥩</span>
                    <span class="text-sm font-medium text-gray-300 group-hover:text-white transition-colors">Cerdo</span>
                </label>
                <label class="flex items-center gap-3 cursor-pointer group">
                    <input type="checkbox" class="w-4 h-4 rounded border-gray-500 text-accent focus:ring-accent accent-accent">
                    <span class="text-xl">🍅</span>
                    <span class="text-sm font-medium text-gray-300 group-hover:text-white transition-colors">Tomates</span>
                </label>
                <label class="flex items-center gap-3 cursor-pointer group">
                    <input type="checkbox" checked class="w-4 h-4 rounded border-gray-500 text-accent focus:ring-accent accent-accent">
                    <span class="text-xl">🌶️</span>
                    <span class="text-sm font-medium text-white transition-colors">Chile Poblano</span>
                </label>
                <!-- Fin Ítem -->
            </div>
        </div>

        <!-- Filtros adicionales -->
        <div class="p-4 border-t border-gray-700">
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Filtros Rápidos</label>
            <div class="flex items-center justify-between bg-darkBg rounded-lg p-2 border border-gray-600">
                <span class="text-sm text-gray-300">Opción Suave (Sin chile)</span>
                <input type="checkbox" class="toggle-checkbox accent-accent w-4 h-4">
            </div>
            <button class="w-full mt-4 bg-accent hover:bg-red-500 text-white font-semibold py-2 rounded-lg transition-colors">
                Consultar Prolog
            </button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL: RESULTADOS -->
    <main class="flex-1 flex flex-col">
        <!-- Barra superior -->
        <header class="h-20 flex items-center justify-between px-8 border-b border-gray-700 bg-panelBg">
            <div class="flex items-center gap-4 w-1/2">
                <input type="text" placeholder="Buscar platillo por nombre..." 
                       class="w-full bg-darkBg border border-gray-600 rounded-full px-5 py-2 text-sm focus:outline-none focus:border-accent text-white">
            </div>
            <div class="flex gap-3">
                <select class="bg-darkBg border border-gray-600 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-accent">
                    <option>Todas las regiones</option>
                    <option>Puebla</option>
                    <option>Yucatán</option>
                    <option>Sonora</option>
                </select>
                <select class="bg-darkBg border border-gray-600 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-accent">
                    <option>Cualquier tiempo</option>
                    <option>< 30 mins</option>
                    <option>< 60 mins</option>
                </select>
            </div>
        </header>

        <!-- Cuadrícula de Recetas (AQUÍ AGUSTÍN HACE EL BUCLE DE TARJETAS) -->
        <div class="flex-1 overflow-y-auto p-8">
            <h2 class="text-2xl font-bold text-white mb-6">Recetas Recomendadas</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                
                <!-- Tarjeta de Receta 1 -->
                <div class="bg-panelBg rounded-2xl overflow-hidden border border-gray-700 shadow-lg hover:border-gray-500 transition-colors">
                    <div class="h-48 bg-gray-600 relative">
                        <!-- Placeholder de imagen -->
                        <img src="https://images.unsplash.com/photo-1564987178120-16c0b9ebcc99?auto=format&fit=crop&w=600&q=80" alt="Chiles en Nogada" class="w-full h-full object-cover">
                        <div class="absolute top-3 right-3 bg-darkBg/80 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-white border border-gray-600">
                            Puebla
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="text-lg font-bold text-white mb-1">Chiles en Nogada</h3>
                        <p class="text-sm text-gray-400 mb-4 capitalize">Plato Fuerte</p>
                        
                        <div class="flex items-center justify-between text-sm text-gray-300">
                            <div class="flex items-center gap-2">
                                <span>⏱️</span> 120 min
                            </div>
                            <div class="flex items-center gap-2">
                                <span>🌶️</span> Bajo
                            </div>
                        </div>
                        
                        <button class="w-full mt-5 bg-darkBg hover:bg-gray-700 border border-gray-600 text-white font-medium py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
                            <span>Ver Detalles</span> <span>→</span>
                        </button>
                    </div>
                </div>

                <!-- Tarjeta de Receta 2 -->
                <div class="bg-panelBg rounded-2xl overflow-hidden border border-gray-700 shadow-lg hover:border-gray-500 transition-colors">
                    <div class="h-48 bg-gray-600 relative">
                        <!-- Placeholder de imagen -->
                        <img src="https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=600&q=80" alt="Tacos al Pastor" class="w-full h-full object-cover">
                        <div class="absolute top-3 right-3 bg-darkBg/80 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-white border border-gray-600">
                            CDMX
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="text-lg font-bold text-white mb-1">Tacos al Pastor</h3>
                        <p class="text-sm text-gray-400 mb-4 capitalize">Plato Fuerte</p>
                        
                        <div class="flex items-center justify-between text-sm text-gray-300">
                            <div class="flex items-center gap-2">
                                <span>⏱️</span> 35 min
                            </div>
                            <div class="flex items-center gap-2">
                                <span>🌶️</span> Medio
                            </div>
                        </div>
                        
                        <button class="w-full mt-5 bg-darkBg hover:bg-gray-700 border border-gray-600 text-white font-medium py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
                            <span>Ver Detalles</span> <span>→</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
